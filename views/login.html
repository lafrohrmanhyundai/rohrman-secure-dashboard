<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rohrman Secure Login</title>
  <style>
    :root{
      --bg:#08111c; --bg2:#0b1523; --line:rgba(255,255,255,.08);
      --text:#edf4ff; --muted:#95a9c6; --cyan:#6ee7f9; --teal:#3dd6c3;
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      font-family:Inter,Arial,sans-serif; color:var(--text);
      background:
        radial-gradient(circle at 0% 0%, rgba(61,214,195,.18), transparent 22%),
        radial-gradient(circle at 100% 0%, rgba(110,231,249,.11), transparent 18%),
        linear-gradient(180deg,var(--bg),var(--bg2));
    }
    .card{
      width:min(460px,92vw);
      background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.025));
      border:1px solid rgba(255,255,255,.08);
      border-radius:22px;
      padding:24px;
      box-shadow:0 18px 50px rgba(0,0,0,.35);
    }
    .eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);font-weight:800;margin-bottom:6px}
    h1{margin:0 0 8px 0;font-size:28px}
    p{margin:0 0 18px 0;color:var(--muted);font-size:13px;line-height:1.4}
    .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
    label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
    input{
      width:100%; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.10);
      color:var(--text); border-radius:12px; padding:12px 14px; font-size:14px; outline:none;
    }
    button{
      cursor:pointer;border:none;color:var(--text);border-radius:12px;padding:12px 14px;font-size:14px;font-weight:800;
      background:linear-gradient(180deg,rgba(110,231,249,.22),rgba(61,214,195,.18));border:1px solid rgba(110,231,249,.18);
      width:100%;
    }
    .hint{margin-top:10px;font-size:12px;color:var(--muted)}
    code{color:#fff}
  </style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <div class="eyebrow">Secure Access</div>
    <h1>Rohrman Daily Summary</h1>
    <p>Sign in to access the protected dashboard page.</p>
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
    </div>
    <button type="submit">Login</button>
    <div class="hint">Default login: <code>rhs</code> / <code>rhs2026</code></div>
  </form>
</body>
</html>
